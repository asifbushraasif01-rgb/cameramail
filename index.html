<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camera Mail</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h2>Camera Mail Demo</h2>

  <video id="video" autoplay playsinline muted></video>

  <canvas id="canvas" style="display:none;"></canvas>

  <img id="preview" alt="Captured photo" style="display:none;max-width:100%;">

  <div class="buttons">
    <button id="startBtn">Start Camera</button>
    <button id="captureBtn" disabled>Capture Photo</button>
    <button id="sendBtn" disabled>Send to Gmail</button>
  </div>

  <p id="status"></p>
</div>

<script src="script.js"></script>

</body>
</html>
